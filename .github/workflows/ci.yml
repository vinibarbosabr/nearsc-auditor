name: ci

on:
  push:
    branches: [main, feat/hackathon]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: dogfood scan (binary end-to-end, gated)
        run: |
          set +e
          cargo run -q -p nearsc -- scan examples/vulnerable-contract --fail-on critical
          code=$?
          set -e
          echo "scan exit code: $code (expected 1: seeded criticals present)"
          test "$code" -eq 1
